name: e2e android
on:
  pull_request:
  push:
    branches: [ccr-29250956-36v71u, main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  e2e:
    # Android emulator needs KVM, which the ubuntu-latest runners provide.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The e2e CLI needs Node 24.8 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Install e2e dependencies
        working-directory: tests
        run: npm ci
      - name: Run the emulator and the flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            cd tests && APK_PATH=../app/build/outputs/apk/debug/app-debug.apk npx e2e run --target android --reporter list,junit
        env:
          E2E_TELEMETRY_DISABLED: "1"
      - name: Upload the e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-report
          path: tests/.e2e
          if-no-files-found: warn

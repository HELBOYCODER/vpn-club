name: Build Hellboy VPN APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Go (Psiphon engine)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Build Psiphon engine (libpsiphon.so)
        run: bash tools/build_psiphon.sh

      - name: Read version from Gradle
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Restore release signing key
        env:
          HB_KEYSTORE_B64: ${{ secrets.HB_KEYSTORE_B64 }}
        run: |
          if [ -n "$HB_KEYSTORE_B64" ]; then
            echo "$HB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hellboy-release.jks"
            echo "HB_KEYSTORE=$RUNNER_TEMP/hellboy-release.jks" >> "$GITHUB_ENV"
            echo "Release key restored"
          else
            echo "::warning::HB_KEYSTORE_B64 secret missing — APK will be debug-signed and won't install over previous versions"
          fi

      - name: Build Android Release APK
        env:
          HB_KEYSTORE_PASSWORD: ${{ secrets.HB_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Print signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "SHA-256|DN" || true

      - name: Copy and rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/HellboyVPN-${{ steps.ver.outputs.version }}.apk"
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HellboyVPN-${{ steps.ver.outputs.version }}-APK
          path: dist/HellboyVPN-${{ steps.ver.outputs.version }}.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.ver.outputs.version }}"
          APK="dist/HellboyVPN-${{ steps.ver.outputs.version }}.apk"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading asset..."
            gh release upload "$TAG_NAME" "$APK" --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Hellboy VPN $TAG_NAME" \
              --notes-file RELEASE_NOTES.md
          fi

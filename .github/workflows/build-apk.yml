name: Build and verify Hellboy VPN

on:
  push:
    branches: [main, hellboy-v4.2, hellboy-v4.3]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: hellboy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Restore signing key or select separate preview app
        env:
          KEY_B64: ${{ secrets.HELLBOY_KEYSTORE_B64 || secrets.HB_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.HELLBOY_KEYSTORE_PASSWORD || secrets.HB_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/hellboy-release.jks"
            echo "HELLBOY_KEYSTORE=$RUNNER_TEMP/hellboy-release.jks" >> "$GITHUB_ENV"
            echo "BUILD_FLAGS=" >> "$GITHUB_ENV"
            echo "APP_ID=com.helboy.vpnclub" >> "$GITHUB_ENV"
            echo "PREVIEW=false" >> "$GITHUB_ENV"
          else
            echo "BUILD_FLAGS=-PhellboyPreview=true" >> "$GITHUB_ENV"
            echo "APP_ID=com.helboy.vpnclub.preview43" >> "$GITHUB_ENV"
            echo "PREVIEW=true" >> "$GITHUB_ENV"
            echo "No fixed release key: building a separate preview app."
          fi
      - name: Unit tests, lint, release and debug builds
        env:
          HELLBOY_KEYSTORE_PASSWORD: ${{ secrets.HELLBOY_KEYSTORE_PASSWORD || secrets.HB_KEYSTORE_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebug $BUILD_FLAGS --no-daemon --stacktrace
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Enable KVM for Android smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and capture real screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/ui_smoke.sh
      - name: UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence
          path: ui-evidence/
      - name: Package and verify APK
        id: package
        run: |
          V=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v$V"
          if [ "$PREVIEW" = "true" ]; then TAG="$TAG-preview.2"; fi
          mkdir -p release-dist
          cp app/build/outputs/apk/release/*.apk "release-dist/HellboyVPN-$TAG.apk"
          if unzip -l "release-dist/HellboyVPN-$TAG.apk" | grep -Ei 'libpsiphon|psiphon_servers'; then
            echo "Removed Psiphon payload still present"; exit 1
          fi
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "release-dist/HellboyVPN-$TAG.apk" > release-dist/signing-certificate.txt
          (cd release-dist && sha256sum "HellboyVPN-$TAG.apk" > SHA256SUMS)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HellboyVPN-${{ steps.package.outputs.tag }}
          path: release-dist/
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its APK and certificate."
            exit 0
          fi
          if [ "$PREVIEW" = "true" ]; then
            gh release create "$TAG" release-dist/* ui-evidence/*.png --target "$GITHUB_SHA" \
              --title "Hellboy VPN 4.3.0 Preview" --prerelease --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" release-dist/* ui-evidence/*.png --target "$GITHUB_SHA" \
              --title "Hellboy VPN 4.3.0" --notes-file RELEASE_NOTES.md
          fi
